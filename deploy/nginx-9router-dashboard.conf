# OPTIONAL — browser access to the 9router dashboard without an SSH tunnel.
#
# 9router binds 127.0.0.1 only, so it is normally unreachable from outside the
# host. This exposes it under a subpath behind HTTP basic auth. Only add it if
# you actually want remote dashboard access; the safer default is a one-off
# `ssh -L 20128:127.0.0.1:20128 you@staging`.
#
# Setup:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-9router <username>
#   sudo chown www-data:www-data /etc/nginx/.htpasswd-9router
#   sudo chmod 640 /etc/nginx/.htpasswd-9router
# then include this file inside the same HTTPS server{} block as the bot, and
#   sudo nginx -t && sudo systemctl reload nginx
#
# CAVEAT: OAuth "connect provider" flows commonly redirect to localhost and may
# not survive being served under a subpath. Expect this to work for viewing
# status, models and API keys -- but use an SSH tunnel when adding a provider.
#
# The dashboard holds live provider credentials. Basic auth over TLS is the
# minimum; prefer also restricting by source IP if your address is stable.

location /9router/ {
    auth_basic           "9router";
    auth_basic_user_file /etc/nginx/.htpasswd-9router;

    # Uncomment to additionally restrict by source address:
    # allow 203.0.113.4;
    # deny  all;

    proxy_pass http://127.0.0.1:20128/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The dashboard streams live updates; without these the UI hangs on load.
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_buffering    off;
    proxy_read_timeout 300s;
}
