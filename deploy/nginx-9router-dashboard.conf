# OPTIONAL — browser access to the 9router dashboard, on its own hostname.
#
# WHY NOT A SUBPATH: serving this under `location /9router/` does not work.
# 9router's root returns `307 -> /dashboard` as an ABSOLUTE path, so the browser
# leaves the subpath immediately and lands on the parent site's 404. Verified
# against 9router 0.5.x:
#     GET /  ->  307  Location: /dashboard
# The dashboard must therefore be served at the root of a dedicated hostname.
#
# SETUP
#   1. DNS: add an A record, e.g. 9router-staging.salon.co.id -> this server
#   2. Password file:
#        sudo apt install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/.htpasswd-9router <user>
#        sudo chown www-data:www-data /etc/nginx/.htpasswd-9router
#        sudo chmod 640 /etc/nginx/.htpasswd-9router
#   3. Install this file:
#        sudo cp nginx-9router-dashboard.conf /etc/nginx/sites-available/9router
#        sudo ln -s /etc/nginx/sites-available/9router /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   4. TLS (certbot rewrites this block to add 443 + redirect):
#        sudo certbot --nginx -d 9router-staging.salon.co.id
#
# This page exposes live provider credentials and your API key. Basic auth over
# TLS is the floor -- add the IP allowlist below if your address is stable.
#
# For CONNECTING a provider, prefer an SSH tunnel regardless of this setup:
#   ssh -L 20128:127.0.0.1:20128 you@staging   ->  http://localhost:20128/dashboard
# OAuth callbacks redirect to localhost and will not complete over a proxy.

server {
    listen 80;
    server_name 9router-staging.salon.co.id;   # <-- change to your hostname

    auth_basic           "9router";
    auth_basic_user_file /etc/nginx/.htpasswd-9router;

    # Uncomment to additionally restrict by source address:
    # allow 203.0.113.4;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:20128;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The dashboard streams live updates; without these the UI hangs.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
