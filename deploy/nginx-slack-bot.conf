# Add inside the existing HTTPS server{} block for your staging domain.
# The bot binds 127.0.0.1:3000 only, so this proxy is its sole route in.
location /slack/events {
    proxy_pass         http://127.0.0.1:3000/slack/events;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Slack retries after 3s, but the handler acks immediately and works
    # in a background thread, so this only needs to cover the ack.
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}
